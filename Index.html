<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aralinks | HFA Student Portal</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>🏫 ARALINKS</h1>
    <p>HFA STUDENT PORTAL</p>
  </header>

  <main>

    <section class="welcome">
      <h2>Welcome to Aralinks!</h2>
      <p id="datetime"></p>
    </section>

    <section class="cards">

      <button onclick="showMessage('Subjects')">
        📚<br>
        <strong>Subjects</strong>
      </button>

      <button onclick="showMessage('Grades')">
        📊<br>
        <strong>Grades</strong>
      </button>

      <button onclick="showMessage('Schedule')">
        📅<br>
        <strong>Schedule</strong>
      </button>

      <button onclick="showMessage('Announcements')">
        🔔<br>
        <strong>Announcements</strong>
      </button>

    </section>

    <section id="content">
      <h2>Dashboard</h2>
      <p>Select an option above to get started.</p>
    </section>

  </main>

  <footer>
    <p>© 2026 HFA Student Portal • Aralinks</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
